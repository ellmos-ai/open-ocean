name: open-ocean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Bytecode compilation check
        run: python -m compileall -q tools tests architecture

      - name: "TEMP probe: loopback reverse DNS timing"
        run: python -c "import socket,time; t=time.perf_counter(); n=socket.getfqdn('127.0.0.1'); print('getfqdn(127.0.0.1) =', n, round(time.perf_counter()-t, 3), 's')"

      - name: Run fast test suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -m "not slow"

  slow-tests:
    name: Slow integration tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Run slow integration tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -m slow

  parity-evidence:
    name: BACH parity evidence (old/new fixtures)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out BACH at the evidence pin
        uses: actions/checkout@v4
        with:
          repository: ellmos-ai/bach
          ref: e619345f358b100ea677a7e6a6d398c42db4e6d4
          path: _parity/bach

      - name: Check out sqlite-transit-sync at the evidence pin
        uses: actions/checkout@v4
        with:
          repository: ellmos-ai/sqlite-transit-sync
          ref: 7648a20b11ca958e9622d2b5d8a13fd02613e92a
          path: _parity/sqlite-transit-sync

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run referenced parity tests (skips fail)
        env:
          PYTHONIOENCODING: utf-8
          REQUIRE_PARITY_EVIDENCE: "1"
          BACH_PARITY_ROOT: ${{ github.workspace }}/_parity/bach
          TRANSIT_SYNC_ROOT: ${{ github.workspace }}/_parity/sqlite-transit-sync
        run: python tools/check_parity_evidence.py --run
