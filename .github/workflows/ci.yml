name: open-ocean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    needs:
      - package-tests
      - package-test-shards
    if: always()
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require complete package test matrix
        if: ${{ always() && (needs.package-tests.result != 'success' || needs.package-test-shards.result != 'success') }}
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,gui]"

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Bytecode compilation check
        run: python -m compileall -q tools tests architecture

      - name: Run fast test suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -m "not slow" --ignore=tests/test_python_packages.py

  package-tests:
    name: Package test plan (${{ matrix.os }}, Python ${{ matrix.python-version }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,gui]"

      - name: Collect complete package test plan
        env:
          PYTHONIOENCODING: utf-8
        run: >-
          python .github/scripts/pytest_package_shard.py plan
          --os "${{ matrix.os }}"
          --python-version "${{ matrix.python-version }}"
          --output "${{ runner.temp }}/package-plan.json"

      - name: Upload cell-specific package test plan
        uses: actions/upload-artifact@v4
        with:
          name: package-test-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/package-plan.json
          if-no-files-found: error
          retention-days: 1

  package-test-shards:
    name: Package tests (${{ matrix.os }}, Python ${{ matrix.python-version }}, shard ${{ matrix.shard }})
    needs: package-tests
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,gui]"

      - name: Download cell-specific package test plan
        uses: actions/download-artifact@v4
        with:
          name: package-test-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/package-test-plan

      - name: Validate complete collection and run assigned package shard
        env:
          PYTHONIOENCODING: utf-8
        run: >-
          python .github/scripts/pytest_package_shard.py run
          --plan "${{ runner.temp }}/package-test-plan/package-plan.json"
          --os "${{ matrix.os }}"
          --python-version "${{ matrix.python-version }}"
          --shard ${{ matrix.shard }}

  slow-tests:
    name: Slow integration tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,gui]"

      - name: Run slow integration tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -m slow

  parity-evidence:
    name: BACH parity evidence (old/new fixtures)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out BACH at the evidence pin
        uses: actions/checkout@v4
        with:
          repository: ellmos-ai/bach
          ref: e619345f358b100ea677a7e6a6d398c42db4e6d4
          path: _parity/bach

      - name: Check out sqlite-transit-sync at the evidence pin
        uses: actions/checkout@v4
        with:
          repository: ellmos-ai/sqlite-transit-sync
          ref: 7648a20b11ca958e9622d2b5d8a13fd02613e92a
          path: _parity/sqlite-transit-sync

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run referenced parity tests (skips fail)
        env:
          PYTHONIOENCODING: utf-8
          REQUIRE_PARITY_EVIDENCE: "1"
          BACH_PARITY_ROOT: ${{ github.workspace }}/_parity/bach
          TRANSIT_SYNC_ROOT: ${{ github.workspace }}/_parity/sqlite-transit-sync
        run: python tools/check_parity_evidence.py --run

      - name: Run local dbsync adapter conformance (carrier required)
        env:
          PYTHONIOENCODING: utf-8
          REQUIRE_DBSYNC_ADAPTER: "1"
          TRANSIT_SYNC_ROOT: ${{ github.workspace }}/_parity/sqlite-transit-sync
        run: python -m pytest -q -rA -p no:cacheprovider tests/test_dbsync_adapter.py
