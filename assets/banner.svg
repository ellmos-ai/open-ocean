<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: -0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        letter-spacing: 0.5px;
      }
      .mono-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
      }
    </style>
    
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d1a"/>
      <stop offset="50%" stop-color="#071e3d"/>
      <stop offset="100%" stop-color="#01060d"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <radialGradient id="glow-ocean" cx="300" cy="170" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020d1a" stop-opacity="0"/>
    </radialGradient>
    
  </defs>
  
  
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.2"/>
    <circle cx="300" cy="170" r="260" fill="url(#glow-ocean)"/>
    
    <!-- Oceanic Wave Lines & Manta Ray / Geometric Ocean Motif -->
    <g transform="translate(160, 65)">
      <!-- Wave contours -->
      <path d="M20 140 Q70 100 120 140 T220 140" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.4"/>
      <path d="M20 115 Q70 75 120 115 T220 115" stroke="#2dd4bf" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M20 90 Q70 50 120 90 T220 90" stroke="#93c5fd" stroke-width="2" fill="none" opacity="0.3"/>
      
      <!-- Central Manta / Compass Star -->
      <g transform="translate(120, 105)">
        <polygon points="0,-45 35,0 0,45 -35,0" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
        <polygon points="0,-25 20,0 0,25 -20,0" fill="#0284c7"/>
        <circle cx="0" cy="0" r="6" fill="#ffffff"/>
      </g>
    </g>
    
  
    <g transform="translate(480, 0)">
      <g transform="translate(0, 58)">
        <rect width="180" height="26" rx="6" fill="#075985" stroke="#38bdf8" stroke-width="1"/>
        <text x="90" y="17" text-anchor="middle" class="badge-text" fill="#bae6fd">COMMUNITY COMMONS</text>
      </g>
      
      <text x="0" y="142" class="title" font-size="58" fill="url(#title-grad)">open-ocean</text>
      
      <text x="0" y="184" class="subtitle" font-size="20" fill="#e0f2fe">Free Open System &amp; Knowledge Commons for ellmos</text>
      <text x="0" y="210" class="subtitle" font-size="14" fill="#94a3b8" opacity="0.8">Free community full stack, collaborative resources, and open agent foundations.</text>
      
      <g transform="translate(0, 246)">
        <g transform="translate(0, 0)">
          <rect width="145" height="32" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#bae6fd">🌊 Free the Ocean</text>
        </g>
        <g transform="translate(157, 0)">
          <rect width="145" height="32" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#bae6fd">🤝 Open Commons</text>
        </g>
        <g transform="translate(314, 0)">
          <rect width="145" height="32" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#bae6fd">🌐 Full System</text>
        </g>
      </g>
    </g>
    
</svg>